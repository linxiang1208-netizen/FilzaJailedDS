name: Build FilzaJailedDS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Theos
        run: |
          export THEOS=~/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          
          # Install ldid (code signing tool)
          brew install ldid
      
      - name: Build Tweak
        run: |
          export THEOS=~/theos
          export PATH="$THEOS/bin:$PATH"
          # Build without FINALPACKAGE to avoid fakeroot issues
          make package
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FilzaJailedDS-deb
          path: packages/*.deb